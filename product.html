<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — BookFox</title>
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/store.css?v=16">
  <link rel="stylesheet" href="/css/product.css?v=16">
  <script src="/script/data.js?v=16" defer></script>
  <script src="/script/main.js?v=16" defer></script>
  <script src="/script/product.js?v=16" defer></script>
</head>
<body id="body" data-page="product">
  <div id="header"></div>

  <section class="prod-page">
    <div class="container">
      <nav class="crumbs" id="crumbs" aria-label="breadcrumb"></nav>

      <div class="p-layout">
        <div class="p-gallery">
          <div class="hex-dec"></div>
          <div class="hex-dec2"></div>
          <span class="p-status">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            In stock
          </span>
          <div class="p-main-img" id="pMainImg"></div>
          <div class="p-thumbs" id="pThumbs"></div>
        </div>

        <div class="p-info">
          <a class="p-author" id="pAuthor" href="#"></a>
          <h1 id="pTitle"></h1>

          <div class="p-price-card">
            <div class="p-price-row">
              <span class="big" id="pPrice"></span>
              <span class="cur" id="pPriceCur"></span>
            </div>
            <div class="p-ship">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
              Free shipping over $30 · 2–4 day delivery
            </div>
          </div>

          <div class="p-buy">
            <div class="qty-stepper">
              <button id="pMinus" aria-label="Decrease quantity">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
              </button>
              <div class="qv" id="pQty">1</div>
              <button id="pPlus" aria-label="Increase quantity">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <button class="btn btn-accent p-add" id="pAdd">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.8h8.6a2 2 0 0 0 2-1.6L21.5 8H6"/><circle cx="10" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>
              Add to cart
            </button>
            <button class="p-icon-btn" id="pShare" title="Copy link" aria-label="Share">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5"/></svg>
            </button>
            <button class="p-icon-btn" id="pFav" title="Add to favorites" aria-label="Favorite">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
            </button>
          </div>

          <div class="p-trust">
            <div class="card">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
              <span>Fast delivery</span>
            </div>
            <div class="card">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
              <span>High quality</span>
            </div>
            <div class="card">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
              <span>Secure pay</span>
            </div>
          </div>
        </div>
      </div>

      <div class="p-tabs" id="pTabs">
        <button class="p-tab active" data-tab="desc">Description</button>
        <button class="p-tab" data-tab="specs">Details</button>
      </div>

      <div class="p-pane active" id="pane-desc">
        <p class="p-desc" id="pDesc"></p>
      </div>
      <div class="p-pane" id="pane-specs">
        <div class="specs" id="pSpecs"></div>
      </div>

      <div class="p-related">
        <div class="section-head">
          <div>
            <h2>You may also like</h2>
            <p class="sub">More from the same shelf</p>
          </div>
        </div>
        <div class="books-grid" id="pRelated"></div>
      </div>
    </div>
  </section>

  <div id="footer"></div>
</body>
</html>
