<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Authors — BookFox</title>
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/store.css?v=16">
  <link rel="stylesheet" href="/css/author.css?v=16">
  <script src="/script/data.js?v=16" defer></script>
  <script src="/script/main.js?v=16" defer></script>
  <script src="/script/authors.js?v=16" defer></script>
</head>
<body id="body" data-page="authors">
  <div id="header"></div>

  <section class="author-hero">
    <div class="container author-hero-card">
      <div class="ah-left">
        <span class="ah-chip">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Our writers
        </span>
        <h1>Meet the <span class="ah-grad">Authors</span></h1>
        <p>Every book on our shelves, grouped by the people who wrote it. Pick a name and explore their full collection.</p>
        <div class="ah-stats" id="allStats"></div>
      </div>
      <div class="ah-art" aria-hidden="true">
        <div class="ah-panel"></div>
        <div class="ahb ahb1">
          <span class="bt-spine"></span>
          <span class="bt-brand">BOOKFOX</span>
          <span class="bt-name">WRITE</span>
          <span class="bt-hex"></span>
          <span class="bt-cat">Authors</span>
        </div>
        <div class="ahb ahb2">
          <span class="bt-spine"></span>
          <span class="bt-brand">BOOKFOX</span>
          <span class="bt-name">READ</span>
          <span class="bt-hex"></span>
          <span class="bt-cat">Collection</span>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <nav class="crumbs" aria-label="breadcrumb">
        <a href="/">Home</a>
        <span class="sep">›</span>
        <span class="cur">Authors</span>
      </nav>
      <div class="section-head">
        <div>
          <h2>All Authors</h2>
          <p class="sub" id="allSub"></p>
        </div>
        <div class="filters">
          <input class="input" id="authorSearch" placeholder="Search authors…" style="width:240px">
        </div>
      </div>
      <div class="author-grid" id="authorGrid"></div>
    </div>
  </section>

  <div id="footer"></div>
</body>
</html>
