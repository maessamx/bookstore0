<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — BookFox</title>
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/store.css?v=16">
  <link rel="stylesheet" href="/css/checkout.css?v=16">
  <script src="/script/data.js?v=16" defer></script>
  <script src="/script/main.js?v=16" defer></script>
  <script src="/script/checkout.js?v=16" defer></script>
</head>
<body id="body" data-page="checkout">
  <div id="header"></div>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <h2>Checkout</h2>
          <p class="sub">Almost there — review your order and place it.</p>
        </div>
      </div>

      <div class="checkout-grid">
        <div class="panel">
          <div class="panel-head"><h3>Shipping details</h3></div>
          <div class="panel-body">
            <form id="coForm" novalidate>
              <div class="grid2">
                <div class="field">
                  <label for="coName">Full name</label>
                  <input class="input" id="coName" placeholder="Your name" required>
                </div>
                <div class="field">
                  <label for="coPhone">Phone</label>
                  <input class="input" id="coPhone" placeholder="01xxxxxxxxx" required>
                </div>
              </div>
              <div class="grid2">
                <div class="field">
                  <label for="coGov">Governorate</label>
                  <select class="input" id="coGov">
                    <option>Cairo</option><option>Giza</option><option>Alexandria</option>
                    <option>Qalyubia</option><option>Dakahlia</option><option>Mansoura</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="field">
                  <label for="coCity">City / District</label>
                  <input class="input" id="coCity" placeholder="e.g. Nasr City">
                </div>
              </div>
              <div class="field">
                <label for="coAddress">Full address</label>
                <textarea class="input" id="coAddress" rows="2" placeholder="Street, building, apartment…" required></textarea>
              </div>
              <div class="field">
                <label for="coPay">Payment method</label>
                <select class="input" id="coPay">
                  <option>Cash on delivery</option>
                  <option>Visa / Mastercard</option>
                  <option>PayPal</option>
                </select>
              </div>
              <div class="field">
                <label for="coNotes">Order notes <span class="muted">(optional)</span></label>
                <textarea class="input" id="coNotes" rows="3" placeholder="Add any notes for your order — delivery instructions, gift wrapping, preferred delivery time…"></textarea>
              </div>
            </form>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Order summary</h3></div>
          <div class="panel-body">
            <div id="coItems"></div>
            <div class="co-totals">
              <div class="row"><span>Subtotal</span><span id="coSubtotal">$0.00</span></div>
              <div class="row"><span>Shipping</span><span id="coShipping">—</span></div>
              <div class="row total"><span>Total</span><span id="coTotal">$0.00</span></div>
            </div>
            <button class="btn btn-accent w100" id="coPlace" style="margin-top:14px">
              Place order
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
            <div class="co-secure">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Secure checkout · Free shipping over $30
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <div class="modal" id="coSuccess">
    <div class="modal-card modal-sm">
      <div class="modal-body center" style="padding:34px 26px">
        <div style="margin-bottom:14px">
          <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="#2e7d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <h3 style="font-size:22px;margin-bottom:6px">Order placed!</h3>
        <p class="muted" style="font-size:14px">Thank you for shopping with BookFox.</p>
        <div class="order-summary" style="text-align:left">
          <div class="row"><span class="muted">Order number</span><b id="ordId"></b></div>
          <div class="row"><span class="muted">Items</span><span id="ordCount"></span></div>
          <div class="row"><span class="muted">Payment</span><span id="ordPay"></span></div>
          <div class="row total"><span>Total</span><span id="ordTotal"></span></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <a class="btn btn-primary w100" href="/my-orders/">Track order</a>
          <a class="btn btn-ghost w100" href="/">Continue</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
