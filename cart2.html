<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter &amp; Verse — Cart</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>

<header>
  <div class="logo">Chapter &amp; Verse</div>

  <nav>
    <a class="active" href="#">Home</a>
    <a href="#">Browse Books</a>
    <a href="#">Categories</a>
    <a href="#">About Us</a>
  </nav>

  <div class="actions">
    <div class="user-chip">
      <span class="user-avatar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
        </svg>
      </span>
      <span class="user-name">Cristiano Ronaldo</span>
    </div>

    <button class="cart-icon" aria-label="Cart">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
      </svg>
      <span id="badge">2</span>
    </button>

    <button class="btn logout-btn">Log Out</button>
  </div>
</header>

<main>
  <section class="card">
    <h1 id="cartTitle">Your Shopping Cart (2 Items)</h1>

    <div class="layout">

      <div id="items"></div>


      <aside class="summary">
        <h2>Order Summary</h2>

        <div class="row">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>

        <div class="row">
          <span>Shipping</span>
          <span id="shipping">$0.00</span>
        </div>

        <hr>

        <div class="row total">
          <span>Total</span>
          <span id="total">$0.00</span>
        </div>

        <button class="btn checkout">Proceed to Checkout</button>

        <input type="text" placeholder="Apply Promo Code">
      </aside>



    </div>
  </section>
</main>

<script src="cart.js"></script>

</body>
</html>
