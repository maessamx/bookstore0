<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>Untitled Page</title>
    <link rel="stylesheet" href="main.css">
    <script src="main.js"></script>

<style>
    header {
  position: fixed;
  top: 0;
  width: 100%;
  background: var(--clr-primary);
  color: White;
  padding: 22px 26px;
  padding-right: 160px;
  z-index: 99999;
  box-shadow:15px 0px 15px 6px black;
}
.dark header{
  background-color: var(--clr-primary-dark);
  box-shadow:15px 0px 15px 6px rgb(255, 255, 255);

}
nav {
  display: flex;
  justify-content: space-between;
}
ul {
  list-style: none;
}
nav ul {
  display: flex;
  align-items: center;
  padding-top: 5px;
}
nav ul li {
  margin-right: 50px;
}

.toggle {
  position: absolute;
  top: 0px;
  right: 50px;
}
.toggle .toggle1 {
  position: relative;
  width: 70px;
  height: 30px;
  border-radius: 20px;
  background: gray;
  transition: 0.3s ease-in;
}
.toggle .toggle1 div {
  width: 30px;
  height: 28px;
  border-radius: 50%;
  background: white;
  position: absolute;
  transition: 0.3s ease-in;

  top: 1px;
}
.toggle .toggle1.active {
  background: blue;
}
.toggle .toggle1.active div {
  background: red;
  right: 1px;
  /*right:1px;*/
  z-index: 99;
}
.profile{
  width: 20px;
  height: 20px;
  border-radius: 50%;
  padding: 5px;
  cursor: pointer;
}
.profile svg{
    width: 50px;
  height: 50px;
  position: relative;
  top: -10px;
}
.menu{
  position: absolute;
  top: 70px;
  width: 180px;
  background-color: var(--clr-primary-dark);
  padding: 6px 10px;
  border-radius: 6px;
}
.menu .btn-a{
margin-bottom: 5px;

}
#menum{
display: none;
}
#menum.active{
display: flex;
}
.menu{
  display: none;
}
.menu.active{
  display: block;
}
</style>
</head>
<body id='body'>
    <header>
        <nav class="relative">
            <div class="flex17">
                📚BookStore
            </div>
            <div>
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="cart.html#home">Cart</a></li>
                    <li><a href="index.html#Books">Books</a></li>
                    <li id="loginli"><a href="login.html#Books">login</a></li>

                </ul>


            </div>
            <div class="relative" id="menum" >
              <div class="profile" onclick="showmenu()">
                
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M463 448.2C440.9 409.8 399.4 384 352 384L288 384C240.6 384 199.1 409.8 177 448.2C212.2 487.4 263.2 512 320 512C376.8 512 427.8 487.3 463 448.2zM64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320zM320 336C359.8 336 392 303.8 392 264C392 224.2 359.8 192 320 192C280.2 192 248 224.2 248 264C248 303.8 280.2 336 320 336z"/></svg>
              </div>
              <div class="menu" id="menu" >
                <div id="nameheader">
                  name
                </div>
                <div id="emailheader">
                  email
                </div>
                <div class="flex flexcol">
                  <a class="btn-a mt-10" href="profile.html">profile</a>
                  <hr>
                  <a class="btn-a mt-10" href="cart.html">Cart</a>
                  <button style="margin-top: 20px;" class="button" onclick="logout()">logout</button>
                </div>
              </div>
            </div>
            <div class="relative">
                <div class='toggle'>
                    <div class='toggle1 ' id='toggle1' onclick="toggledark()">
                        <div></div>
                    </div>
                </div>
            </div>

        </nav>
    </header>
    <div style="height: 100px;"></div>

</body>

</html>
