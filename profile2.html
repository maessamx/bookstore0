<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>

 <main class="profile-card">   

    <div class="card-left-banner">
        <h3 class="banner-title">My Chapter & Profile Verse</h3>
    </div>
    
    
    <div class="form-container">
        <form class="profile-form">

            <div class="form-header">
                <h2 class="form-title">Profile details</h2>
            </div>

            <div class="avatar-upload-section">
                <div class="avatar-circle">
                    
                    <svg id="profile-svg" width="100" height="100" viewBox="0 0 100 100">
                        <defs>
                            <clipPath id="circle-clip">
                                <circle cx="50" cy="50" r="50" />
                            </clipPath>
                        </defs>

                        <!--(Group 1) Avatar icon -->
                        <g id="default-avatar" display="inline">
                           
                            <circle cx="50" cy="35" r="15" fill="#35231c" />
                         
                            <path d="M 20 85 A 30 30 0 0 1 80 85 Z" fill="#35231c" />
                        </g>

                        <!-- (Group 2)Uploaded image(hidden in the first)-->
                        <image id="uploaded-image" x="0" y="0" width="100" height="100" 
                               preserveAspectRatio="xMidYMid slice" 
                               clip-path="url(#circle-clip)" 
                               display="none" 
                               href="" />
                    </svg>
                </div>

                <br>
                <label for="profile-photo" class="upload-label"><b>Upload Your Profile Photo</b></label>
                <br>
                <input id="profile-photo" type="file" class="file-input">
            </div>
              
            <!--inputs-->
            <div class="form-group">
                <label for="fullname"><b>Full Name</b></label>
                <br>
                <div class="input-wrapper">
                    <input id="fullname" type="text" placeholder="enter your full name" required >
                </div>
            </div>

            <div class="form-group">
               <label for="email"><b>Email</b></label>
               <br>
               <div class="input-wrapper">
                   <input id="email" type="email" placeholder="ex : whatever@whatever.com" required >
               </div>
            </div>

            <div class="form-group">
                <label for="address"><b>Address</b></label>
                <br>
                <div class="input-wrapper">
                    <input id="address" type="text" placeholder="1 Amr Mohamed - Faisel" required >
                </div>
            </div>

            <div class="form-group">
                <label for="phone"><b>Phone Number</b></label>
                <br>
                <div class="input-wrapper">
                   <input id="phone" name="phone" type="tel" placeholder="01123348838" required maxlength="11"  pattern="01[0-9]{9}" title="Phone number must start with 01 and be exactly 11 digits long.">
                </div>
            </div>

            <br>

            <!--buttons-->
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Update your details</button>
                <button type="reset" class="btn btn-outline" id="reset-btn">Clear Your Data</button>
                <br>
                <button type="button" class="btn btn-outline">RESET PASSWORD</button>
            </div>

        </form>
    </div>
    <script src="profile.js"></script>
 </main>    
</body>
</html>
