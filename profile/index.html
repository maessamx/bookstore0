<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — BookFox</title>
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/store.css?v=16">
  <link rel="stylesheet" href="/css/account.css?v=16">
  <script src="/script/data.js?v=16" defer></script>
  <script src="/script/main.js?v=16" defer></script>
  <script src="/script/profile.js?v=16" defer></script>
</head>
<body id="body" data-page="profile">
  <div id="header"></div>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <h2>My Profile</h2>
          <p class="sub">Manage your account details</p>
        </div>
      </div>

      <div class="account-grid">
        <aside class="panel">
          <div class="panel-body center">
            <div class="acct-avatar" id="pAvatar">A</div>
            <h3 id="pName" style="margin-top:12px">—</h3>
            <p class="muted" id="pEmail" style="font-size:13.5px">—</p>
            <div style="margin-top:10px"><span class="badge badge-user" id="pRole">user</span></div>
          </div>
        </aside>

        <div class="panel">
          <div class="panel-head"><h3>Account details</h3></div>
          <div class="panel-body">
            <form id="profileForm" novalidate>
              <div class="field">
                <label for="pFName">Full name</label>
                <input class="input" id="pFName" required>
              </div>
              <div class="grid2">
                <div class="field">
                  <label for="pFPhone">Phone</label>
                  <input class="input" id="pFPhone">
                </div>
                <div class="field">
                  <label for="pFGov">Governorate</label>
                  <select class="input" id="pFGov">
                    <option>Cairo</option><option>Giza</option><option>Alexandria</option>
                    <option>Qalyubia</option><option>Dakahlia</option><option>Mansoura</option>
                    <option>Other</option>
                  </select>
                </div>
              </div>
              <button class="btn btn-accent" type="submit">Save changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer"></div>
</body>
</html>
