<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>Untitled Page</title>
    
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="profile.css">
    <script src="main.js"></script>
<script>
    showheader();
    showfooter();
</script>
<body id='body'>
<div id="header"></div>
 <main class="flex17 ">   
<section class="profile-card ">


    <div class="card-left-banner">
        <h3 class="banner-title">My Chapter & Profile Verse</h3>
    </div>
    
    
    <div class="form-container">
        <form class="profile-form">

            <div class="form-header">
                <h2 class="form-title">Profile details</h2>
            </div>

            <div class="avatar-upload-section">
                <div class="avatar-circle">
                    
                    <svg id="profile-svg" width="100" height="100" viewBox="0 0 100 100">
                        <defs>
                            <clipPath id="circle-clip">
                                <circle cx="50" cy="50" r="50" />
                            </clipPath>
                        </defs>

                        <g id="default-avatar" display="inline">
                           
                            <circle cx="50" cy="35" r="15" fill="#35231c" />
                         
                            <path d="M 20 85 A 30 30 0 0 1 80 85 Z" fill="#35231c" />
                        </g>

                        <image id="uploaded-image" x="0" y="0" width="100" height="100" 
                               preserveAspectRatio="xMidYMid slice" 
                               clip-path="url(#circle-clip)" 
                               display="none" 
                               href="" />
                    </svg>
                </div>

                <br>
                <label for="profile-photo" class="upload-label"><b>Upload Your Profile Photo</b></label>
                <br>
                <input id="profile-photo" type="file" class="file-input">
            </div>
              
            <div class="form-group">
                <label for="fullname"><b>Full Name</b></label>
                <br>
                <div class="input-wrapper2">
                    <input id="fullname" type="text" placeholder="enter your full name" required >
                </div>
            </div>

            <div class="form-group">
               <label for="email"><b>Email</b></label>
               <br>
               <div class="input-wrapper2">
                   <input id="email" type="email" placeholder="ex : whatever@whatever.com" required >
               </div>
            </div>

            <div class="form-group">
                <label for="governorate"><b>governorate</b></label>
                <br>
                <div class="input-wrappe2r">
                    <input id="governorate" type="text" placeholder="1 Amr Mohamed - Faisel" required >
                </div>
            </div>

            <div class="form-group">
                <label for="phone"><b>Phone Number</b></label>
                <br>
                <div class="input-wrapper2">
                   <input id="phone" name="phone" type="tel" placeholder="01123348838" required maxlength="11"  pattern="01[0-9]{9}" title="Phone number must start with 01 and be exactly 11 digits long.">
                </div>
            </div>

            <br>

            <div class="button-group">
                <button type="submit" class="button ">Update your details</button>
                <button type="reset" class="button" id="reset-button">Clear data</button>
                <br>
                <button type="button" style="width: 290px;" class="button">RESET PASSWORD</button>
            </div>

        </form>
    </div>
    </section>
</main>   
<script type="module" src="profile.js"></script>
<div style="height: 100px;"></div>
<div id="footer"></div>
</body>

</html>
