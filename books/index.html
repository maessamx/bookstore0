<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books — BookFox Admin</title>
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/admin.css?v=16">
  <script src="/script/data.js?v=16" defer></script>
  <script src="/script/main.js?v=16" defer></script>
  <script src="/script/admin.js?v=16" defer></script>
  <script src="/script/books-admin.js?v=16" defer></script>
</head>
<body id="body" data-page="admin">

<div class="admin">
  <aside class="sidebar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/images/logo.png?v=16" alt="BookFox logo">
      <span>BookFox</span>
    </a>
    <nav class="side-nav">
    <div class="side-label">Menu</div>
      <a href="/dashboard/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </a>
      <a class="active" href="/books/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Books
      </a>
      <a href="/supplies/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Supplies
      </a>
      <a href="/authors/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Authors
      </a>
      <a href="/orders/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Orders
      </a>
      <a href="/users/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Users
      </a>
    </nav>
    <div class="side-profile">
      <span class="sp-avatar" id="sideAvatar">A</span>
      <div style="min-width:0">
        <div class="sp-name" id="sideName">Admin</div>
        <div class="sp-role">Admin</div>
      </div>
    </div>
    <div class="sidebar-foot">
      <a href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        View store
      </a>
      <button id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="topbar">
      <h1>Books Management<small>· Admin Panel</small></h1>
      <div class="topbar-right">
        <div class="user-chip">
          <span class="user-avatar" id="adminAvatar">A</span>
          <span class="user-name" id="adminName">Admin</span><span class="admin-role">Admin</span>
        </div>
        <button class="icon-btn tb-bell" aria-label="Notifications" title="Notifications">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot"></span>
        </button>
        <button class="theme-toggle icon-btn" aria-label="Toggle theme"></button>
      </div>
    </header>

    <main class="admin-content">
      <div class="panel">
        <div class="panel-head">
          <h3 id="bookCount">Books</h3>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <input class="input" id="bookSearch" placeholder="Search title or author…" style="width:230px">
            <button class="btn btn-accent" id="addBookBtn">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Book
            </button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data">
            <thead>
              <tr><th>Cover</th><th>Title</th><th>Author</th><th>Category</th><th>Price</th><th style="text-align:right">Actions</th></tr>
            </thead>
            <tbody id="bookRows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal" id="bookFormModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 class="modal-title" id="bfTitle">Add Book</h3>
      <button class="icon-btn sm modal-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="bfId">
      <div class="field">
        <label for="bfTitleI">Book title</label>
        <input class="input" id="bfTitleI" placeholder="e.g. The Great Gatsby" required>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="bfAuthor">Author</label>
          <input class="input" id="bfAuthor" placeholder="e.g. F. Scott Fitzgerald" required>
        </div>
        <div class="field">
          <label for="bfCat">Category</label>
          <input class="input" id="bfCat" list="catList" placeholder="e.g. Fantasy" required>
          <datalist id="catList"></datalist>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="bfPrice">Price ($)</label>
          <input class="input" id="bfPrice" type="number" min="0" step="0.01" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="bfCover">Cover image URL <span class="muted">(optional)</span></label>
          <input class="input" id="bfCover" placeholder="https://… or /images/…">
        </div>
      </div>
      <div class="field">
        <label for="bfGallery">Extra gallery images <span class="muted">(optional — comma separated URLs)</span></label>
        <input class="input" id="bfGallery" placeholder="https://…, https://…">
      </div>
      <div class="field">
        <label for="bfDesc">Description</label>
        <textarea class="input" id="bfDesc" placeholder="Short description of the book…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost modal-close">Cancel</button>
      <button class="btn btn-accent" id="bfSave">Save Book</button>
    </div>
  </div>
</div>
</body>
</html>
